<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pablo's Car Rentals</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .auth-card h2 {
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-card p {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass-panel pop-in">
            <h2 style="text-align:center;">Welcome Back</h2>
            <p>Login to your account or admin panel</p>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" style="color: var(--primary-color);">Forgot Password?</a>
            </div>
            <button class="btn-primary" style="width: 100%; margin-bottom: 20px; text-align: center;" onclick="handleLogin()">Login</button>
            <p style="margin-bottom:0;">Don't have an account? <a href="register.html" style="color: var(--primary-color);">Sign Up</a></p>
        </div>
    </div>
    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            // Mock authentication routing based on email
            if(email.toLowerCase().includes('admin')) {
                window.location.href = 'admin-panel.html';
            } else {
                window.location.href = 'customer-dashboard.html';
            }
        }
    </script>
</body>
</html>

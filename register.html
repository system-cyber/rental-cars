<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pablo's Car Rentals</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }
        .auth-card h2 {
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-card p {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass-panel pop-in">
            <h2 style="text-align:center;">Create Account</h2>
            <p>Join us to manage your bookings easily</p>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
            </div>
            <button class="btn-primary" style="width: 100%; margin-bottom: 20px; text-align: center;" onclick="window.location.href='login.html'">Sign Up</button>
            <p style="margin-bottom:0; text-align: center;">Already have an account? <a href="login.html" style="color: var(--primary-color);">Login</a></p>
        </div>
    </div>
</body>
</html>
